# SEGGER J-Link (JTAG) — K1921VG015 hub flash/debug adapter.
# Counterpart to sipeed_jtag.cfg for the FT2232 adapter. Select with:
#   make -f flash-hub.mk flash-hub OPENOCD_IFACE_CFG=jlink.cfg
adapter driver jlink
transport select jtag
adapter speed 1500

# adapter serial 000000000   ;# set if more than one J-Link is attached